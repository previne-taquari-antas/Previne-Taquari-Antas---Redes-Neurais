name: Validação da mancha (MUP RS por cidade)

# Só para validar a mancha gerada pelo terreno; roda num branch de validação e grava nele.
on:
  push:
    branches: ["claude/validacao-mancha"]
    paths: ["validacao/recorta_mup.py", ".github/workflows/validacao-mancha-mup.yml"]

permissions:
  contents: write

jobs:
  recorta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pillow shapely pyogrio pyproj
      - name: Baixar a área diretamente atingida 2024
        run: |
          set -euo pipefail
          python codigo_python/09_rota_fuga/baixar_mancha_mup.py /tmp/mup
          mkdir -p /tmp/mup/ada && unzip -o -q /tmp/mup/ada.zip -d /tmp/mup/ada
      - name: Recortar por cidade
        run: |
          set -euo pipefail
          mapfile -t SHPS < <(find /tmp/mup/ada -iname '*.shp' | sort)
          python validacao/recorta_mup.py "${SHPS[@]}"
      - name: Gravar no branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validacao/mup_*.geojson
          git diff --cached --quiet && exit 0
          git commit -m "validação: MUP RS por cidade [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
