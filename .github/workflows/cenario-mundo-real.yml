name: Cenário municipal com serviços reais

# Busca do lugar, ruas e edificações do OpenStreetMap, relevo Copernicus e cálculo, em lugares
# de países diferentes. Depende de serviços de fora: só roda quando essa parte muda, ou à mão.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "assets/js/cenario_osm.js"
      - "tests/frontend/cenario_mundo_real.cjs"
      - ".github/workflows/cenario-mundo-real.yml"

permissions:
  contents: read

concurrency:
  group: cenario-mundo-real-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mundo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lugar:
          - lajeado
          - alfafar
          - ahrweiler
          - mucum
          - santa_tereza
          - roca_sales
          - encantado
          - petropolis
          - faenza
          - ellicott
          - derna
          - pepinster
          - quilmes
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /cenario_municipal.html
            /assets/js/
            /assets/data/rota_fuga/santa_tereza_pontos_encontro_hand.json
            /tests/frontend/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json
      - name: Install pinned browser dependencies
        working-directory: tests/frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Fluxo completo em ${{ matrix.lugar }}
        env:
          LUGAR: ${{ matrix.lugar }}
        run: node tests/frontend/cenario_mundo_real.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cenario-mundo-real-${{ matrix.lugar }}
          path: /tmp/previne-cenario-mundo
          retention-days: 14
