name: Santa Tereza - RNA 8h independente

on:
  push:
    branches: [main]
    paths:
      - 'scripts/rodar_stz_8h_independente.py'
      - 'previne/robo/gerar_previsao_ao_vivo.py'
      - 'previne/robo/fontes_chuva_8h.py'
      - '.github/workflows/stz-8h-independente.yml'
  schedule:
    # Execucao autonoma a cada 30 minutos, sem bloquear 2h e 4h.
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stz-8h-independente
  cancel-in-progress: false

jobs:
  prever-8h:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias das RNAs
        run: pip install numpy==2.4.6 scipy==1.17.1 h5py==3.16.0 openpyxl==3.1.5
      - name: Conferir contrato e sintaxe
        run: |
          python -B -m py_compile scripts/rodar_stz_8h_independente.py
          python -B -m unittest scripts.test_stz_8h_excel_mother_contract
      - name: Rodar RNAs 8h com checagem de entradas
        run: |
          PYTHONUNBUFFERED=1 timeout --signal=TERM --kill-after=20s 600s python -B -m scripts.rodar_stz_8h_independente
      - name: Validar saida independente
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          p = Path('previsao_stz_8h.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['estacao'] == '86472600'
          assert set(d['horizontes']) == {'8h','8h_v002'}
          for key, v in d['horizontes'].items():
              assert v['horizonte'] == key
              assert v['horizonte_h'] == 8
              assert v['hand_zero_cm'] == 160
              if v.get('disponivel'):
                  assert v.get('nivel_previsto_cm') is not None
                  assert v.get('auditoria_inputs', {}).get('status') == 'NORMAL'
                  assert v.get('hora_modelo') and v.get('hora_alvo')
              else:
                  assert v.get('nivel_previsto_cm') is None
          print('8h independent: schema e guardas OK')
          PY
      - name: Publicar apenas o resultado de 8h
        run: |
          git config user.name 'previne-robo'
          git config user.email 'previne-robo@users.noreply.github.com'
          git add previsao_stz_8h.json
          if [ -f assets/data/stz_8h_niveis_observados_cache.json ]; then
            git add assets/data/stz_8h_niveis_observados_cache.json
          fi
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'bot: atualiza RNA 8h Santa Tereza [skip ci]'
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
