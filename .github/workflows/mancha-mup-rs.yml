name: Mancha do mapa único (MUP RS) e pontos de encontro

# Baixa a Área Diretamente Atingida das cheias de 2024 (Mapa Único do Plano Rio Grande,
# publicada pela FEPAM), recorta para Santa Tereza e Muçum, recalcula os pontos de encontro
# (codigo_python/09_rota_fuga/pontos_encontro.py) e grava no próprio branch.
on:
  workflow_dispatch:
  push:
    branches: [claude/pontos-encontro-mup]
    paths: [".github/workflows/mancha-mup-rs.yml"]

permissions:
  contents: write

concurrency:
  group: mancha-mup-rs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mancha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependências
        run: python -m pip install numpy pillow shapely pyogrio pyproj
      - name: Achar e baixar a área diretamente atingida 2024 (FEPAM)
        run: |
          set -euo pipefail
          mkdir -p /tmp/mup
          PAGINA=https://fepam.rs.gov.br/arquivos-geoespaciais-eventos-climaticos-de-maio-de-2024
          curl -fsSL --retry 3 -A "Mozilla/5.0 (PREVINE; pesquisa UFRGS)" "$PAGINA" -o /tmp/mup/pagina.html
          python - <<'PY'
          import html, re, urllib.parse
          s = open("/tmp/mup/pagina.html", encoding="utf-8", errors="replace").read()
          base = "https://fepam.rs.gov.br/arquivos-geoespaciais-eventos-climaticos-de-maio-de-2024"
          links = []
          for m in re.finditer(r'<a\b[^>]*href="([^"]+)"[^>]*>(.*?)</a>', s, re.S | re.I):
              href, texto = m.group(1), re.sub(r"<[^>]+>", " ", m.group(2))
              texto = " ".join(html.unescape(texto).split())
              if re.search(r"\.(zip|rar|7z|gpkg|kmz)(\?|$)", href, re.I) or "upload" in href.lower():
                  links.append((urllib.parse.urljoin(base, href), texto))
          for u, t in links:
              print("LINK:", t, "->", u)
          alvo = [u for u, t in links if re.search(r"\.(zip|rar|7z|gpkg|kmz)(\?|$)", u, re.I)
                  and re.search(r"atingid|diretamente|\bada\b", t + " " + u, re.I)]
          if not alvo:
              raise SystemExit("não achei o arquivo da área diretamente atingida na página")
          open("/tmp/mup/url.txt", "w").write(alvo[0])
          print("ESCOLHIDO:", alvo[0])
          PY
          curl -fsSL --retry 3 -A "Mozilla/5.0 (PREVINE; pesquisa UFRGS)" "$(cat /tmp/mup/url.txt)" -o /tmp/mup/ada.zip
          ls -la /tmp/mup/ada.zip && sha256sum /tmp/mup/ada.zip
          mkdir -p /tmp/mup/ada && unzip -o -q /tmp/mup/ada.zip -d /tmp/mup/ada
          find /tmp/mup/ada -type f | sed 's/^/ARQ: /'
      - name: Recortar a mancha para Santa Tereza e Muçum
        run: |
          set -euo pipefail
          mapfile -t SHPS < <(find /tmp/mup/ada -iname '*.shp' | sort)
          printf 'SHP: %s\n' "${SHPS[@]}"
          python - "${SHPS[@]}" <<'PY'
          import sys, pyogrio
          for p in sys.argv[1:]:
              i = pyogrio.read_info(p)
              print(p, "| feições:", i["features"], "| CRS:", i["crs"], "| campos:", list(i["fields"]), "| tipo:", i["geometry_type"])
          PY
          python codigo_python/09_rota_fuga/preparar_mancha.py "${SHPS[@]}"
          echo "URL: $(cat /tmp/mup/url.txt)" > /tmp/mup/origem.txt
          sha256sum /tmp/mup/ada.zip >> /tmp/mup/origem.txt
      - name: Pontos de encontro
        run: |
          set -euo pipefail
          for c in santa_tereza mucum; do
            if [ -f "assets/data/rota_fuga/mup_rs_ada_${c}.geojson" ]; then
              python codigo_python/09_rota_fuga/pontos_encontro.py "$c" --gravar
            fi
          done
          python tests/test_pontos_encontro.py -v
      - name: Gravar no branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/rota_fuga/mup_rs_ada_*.geojson assets/data/rota_fuga/*_pontos_encontro_mup.json
          if git diff --cached --quiet; then echo "nada mudou"; exit 0; fi
          git commit -m "dados: mancha do MUP RS (FEPAM, área diretamente atingida 2024) e pontos de encontro" \
            -m "$(cat /tmp/mup/origem.txt)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mancha-mup-rs
          path: |
            /tmp/mup/pagina.html
            /tmp/mup/origem.txt
            assets/data/rota_fuga/mup_rs_ada_*.geojson
            assets/data/rota_fuga/*_pontos_encontro_mup.json
          if-no-files-found: warn
