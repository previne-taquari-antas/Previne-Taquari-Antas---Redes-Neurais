name: Mancha com incerteza - Mucum (sombra)

# Pesquisa em sombra: não altera a previsão ao vivo nem a página.
# Roda depois de cada ciclo da previsão ao vivo de Muçum e grava
# assets/data/mucum_mancha_incerteza/{sombra_atual.json,historico_sombra.jsonl}.

on:
  workflow_run:
    workflows:
      - "Previsao ao vivo - Mucum"
    types:
      - completed
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

jobs:
  sombra:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: mancha-incerteza-mucum-sombra
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Gerar e publicar sombra
        run: |
          git config user.name  "previne-robo"
          git config user.email "previne-robo@users.noreply.github.com"
          git pull --rebase --autostash origin main
          python -B -m unittest scripts.test_mancha_incerteza_sombra -v
          python -B codigo_python/01_previsao_ao_vivo/gerar_mancha_incerteza_mucum_sombra.py
          git add assets/data/mucum_mancha_incerteza/sombra_atual.json assets/data/mucum_mancha_incerteza/historico_sombra.jsonl
          if git diff --staged --quiet; then
            echo "sem mudanca neste ciclo"
            exit 0
          fi
          git commit -m "bot: sombra mancha com incerteza Mucum [skip ci]"
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "push rejeitado (${tentativa}), rebase..."
            sleep 3
          done
          echo "falha ao publicar a sombra"
          exit 1
