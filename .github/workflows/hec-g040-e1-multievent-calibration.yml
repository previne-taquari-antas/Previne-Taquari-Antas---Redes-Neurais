name: HEC G040 E1 multi-event calibration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/g040_e1_multievent_calibration_request.json"
      - "config/g040_stage2_execution_v1.json"
      - "scripts/build_g040_historical_calibration_forcing.py"
      - "scripts/calibrate_hec_hms_g040_e1_multievent.py"
      - "scripts/run_hec_hms_g040_e1_hindcast.py"
      - "scripts/test_g040_multievent_calibration_contract.py"
      - ".github/workflows/hec-g040-e1-multievent-calibration.yml"
  pull_request:
    paths:
      - "config/g040_e1_multievent_calibration_request.json"
      - "config/g040_stage2_execution_v1.json"
      - "scripts/build_g040_historical_calibration_forcing.py"
      - "scripts/calibrate_hec_hms_g040_e1_multievent.py"
      - "scripts/run_hec_hms_g040_e1_hindcast.py"
      - "scripts/test_g040_multievent_calibration_contract.py"
      - ".github/workflows/hec-g040-e1-multievent-calibration.yml"

permissions:
  contents: write

concurrency:
  group: hec-g040-e1-multievent-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python dependencies
        run: pip install --disable-pip-version-check numpy shapely pyproj

      - name: Contract tests
        run: |
          python -B scripts/test_g040_multievent_calibration_contract.py
          python -B scripts/test_g040_e1_numerical_stability.py

      - name: Cache HEC-HMS 4.13
        if: github.event_name != 'pull_request'
        id: cache-hec
        uses: actions/cache@v4
        with:
          path: .hec
          key: hec-hms-4.13-linux64-v1

      - name: Download HEC-HMS 4.13
        if: github.event_name != 'pull_request' && steps.cache-hec.outputs.cache-hit != 'true'
        run: |
          mkdir -p .hec
          curl -L --fail --retry 3 --retry-delay 4             -o /tmp/HEC-HMS-4.13-linux64.tar.gz             https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.38/HEC-HMS-4.13-linux64.tar.gz
          tar -xzf /tmp/HEC-HMS-4.13-linux64.tar.gz -C .hec

      - name: Build fixed historical calibration forcing
        if: github.event_name != 'pull_request'
        run: |
          python -B scripts/build_g040_historical_calibration_forcing.py             --events E22_SEP2023,E24_NOV2023             --max-workers 12

      - name: Verify calibration forcing gates
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("assets/data/hec_hms_g040_full_basin/historical_calibration_forcing")
          for event in ("E22_SEP2023","E24_NOV2023"):
              rain=json.load(open(root/event/"rain.json",encoding="utf-8"))
              hydro=json.load(open(root/event/"hydro.json",encoding="utf-8"))
              print(event, rain["status"], rain["network"]["valid_rain_station_count"], rain["rain_diagnostics"])
              assert rain["status"] in {"OBSERVED_RAIN_READY","OBSERVED_RAIN_PARTIAL"}
              assert rain["network"]["valid_rain_station_count"] > 0
              assert len(rain["components"]) == 11
              controls={str(x["code"]):x for x in hydro["controls"]}
              q=sum(1 for r in controls["86472000"]["recent_rows"] if r.get("flow_m3s") is not None)
              assert q >= 24, (event,q)
          PY

      - name: Run initial multi-event calibration search
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          test -n "$HEC_SH"
          set +e
          python -B scripts/calibrate_hec_hms_g040_e1_multievent.py "$HEC_SH" --qmc 12             > /tmp/g040_multievent_calibration.stdout 2>&1
          RC=$?
          set -e
          cat /tmp/g040_multievent_calibration.stdout
          echo "$RC" > /tmp/g040_multievent_calibration_rc.txt
          test -f assets/data/hec_hms_g040_full_basin/g040_e1_multievent_calibration_latest.json
          test -f assets/data/hec_hms_g040_full_basin/g040_e1_multievent_calibration_candidates.csv

      - name: Publish calibration evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE="assets/data/hec_hms_g040_full_basin"
          FORCING="$BASE/historical_calibration_forcing"
          mkdir -p /tmp/g040-calibration/E22_SEP2023 /tmp/g040-calibration/E24_NOV2023
          cp "$FORCING/manifest_latest.json" /tmp/g040-calibration/
          for E in E22_SEP2023 E24_NOV2023; do
            cp "$FORCING/$E/rain.json" "/tmp/g040-calibration/$E/"
            cp "$FORCING/$E/hydro.json" "/tmp/g040-calibration/$E/"
            cp "$FORCING/$E/scenario.json" "/tmp/g040-calibration/$E/"
          done
          cp "$BASE/g040_e1_multievent_calibration_latest.json" /tmp/g040-calibration/
          cp "$BASE/g040_e1_multievent_calibration_candidates.csv" /tmp/g040-calibration/
          cp /tmp/g040_multievent_calibration.stdout /tmp/g040-calibration/calibration_stdout.txt
          cp /tmp/g040_multievent_calibration_rc.txt /tmp/g040-calibration/calibration_exit_code.txt

          git config user.name "previne-g040-calibration-bot"
          git config user.email "previne-g040-calibration-bot@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$FORCING/E22_SEP2023" "$FORCING/E24_NOV2023"
            cp /tmp/g040-calibration/manifest_latest.json "$FORCING/"
            for E in E22_SEP2023 E24_NOV2023; do
              cp "/tmp/g040-calibration/$E/rain.json" "$FORCING/$E/"
              cp "/tmp/g040-calibration/$E/hydro.json" "$FORCING/$E/"
              cp "/tmp/g040-calibration/$E/scenario.json" "$FORCING/$E/"
            done
            cp /tmp/g040-calibration/g040_e1_multievent_calibration_latest.json "$BASE/"
            cp /tmp/g040-calibration/g040_e1_multievent_calibration_candidates.csv "$BASE/"
            cp /tmp/g040-calibration/calibration_stdout.txt "$BASE/"
            cp /tmp/g040-calibration/calibration_exit_code.txt "$BASE/"

            git add --               "$FORCING/manifest_latest.json"               "$FORCING/E22_SEP2023/rain.json"               "$FORCING/E22_SEP2023/hydro.json"               "$FORCING/E22_SEP2023/scenario.json"               "$FORCING/E24_NOV2023/rain.json"               "$FORCING/E24_NOV2023/hydro.json"               "$FORCING/E24_NOV2023/scenario.json"               "$BASE/g040_e1_multievent_calibration_latest.json"               "$BASE/g040_e1_multievent_calibration_candidates.csv"               "$BASE/calibration_stdout.txt"               "$BASE/calibration_exit_code.txt"

            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "bot: update G040 E1 multi-event calibration [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

  research-pr-hec:
    # Isolated full HEC-HMS experiment for this research PR only.
    # No commits/push to main; outputs stay as GitHub Actions artifacts.
    if: github.event_name == 'pull_request' && github.head_ref == 'research/mucum-balanced-hydrographs-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: pip install --disable-pip-version-check numpy shapely pyproj
      - name: Run calibration unit and numerical tests
        run: |
          python -B scripts/test_g040_multievent_calibration_contract.py
          python -B scripts/test_g040_e1_numerical_stability.py
          python -B scripts/test_g040_frozen_2024_transfer.py
      - name: Download official HEC-HMS 4.13 for isolated research run
        run: |
          set -euo pipefail
          mkdir -p .hec
          curl -L --fail --retry 3 --retry-delay 4 -o /tmp/HEC-HMS-4.13-linux64.tar.gz \
            https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.38/HEC-HMS-4.13-linux64.tar.gz
          tar -xzf /tmp/HEC-HMS-4.13-linux64.tar.gz -C .hec
      - name: Build observed historical G040 rainfall and hydrometric forcing
        run: |
          python -B scripts/build_g040_historical_calibration_forcing.py \
            --events E22_SEP2023,E24_NOV2023 --max-workers 12
      - name: Verify observation coverage for research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("assets/data/hec_hms_g040_full_basin/historical_calibration_forcing")
          for event in ("E22_SEP2023","E24_NOV2023"):
              rain=json.loads((base/event/"rain.json").read_text(encoding="utf-8"))
              d=rain["rain_diagnostics"]
              print(event, "median stations/h:",d["median_valid_station_count"],
                    "minimum:",d["minimum_valid_station_count"],
                    "valid hours:",d["hours_with_any_station"])
              if d["hours_with_any_station"] == 0:
                  raise RuntimeError(event+" has no observed rainfall")
          PY
      - name: Run 12 QMC plus anchor multi-event HEC-HMS simulations
        shell: bash
        run: |
          set -euo pipefail
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          test -n "$HEC_SH"
          set +e
          python -B scripts/calibrate_hec_hms_g040_e1_multievent.py "$HEC_SH" --qmc 12 \
            > hec_research_stdout.txt 2>&1
          RC=$?
          set -e
          cat hec_research_stdout.txt
          echo "$RC" > hec_research_exit_code.txt
          test -f assets/data/hec_hms_g040_full_basin/g040_e1_multievent_calibration_latest.json
      - name: Research-only Muçum routing attenuation sensitivity
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          test -n "$HEC_SH"
          set +e
          python -B scripts/run_g040_reach_attenuation_sensitivity.py "$HEC_SH" \
            > hec_routing_sensitivity_stdout.txt 2>&1
          RC=$?
          set -e
          cat hec_routing_sensitivity_stdout.txt
          echo "$RC" > hec_routing_sensitivity_exit_code.txt
          test -f assets/data/hec_hms_g040_full_basin/g040_e1_mucum_routing_sensitivity_latest.json
      - name: Test temporary overbank floodplain storage through Muçum
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          test -n "$HEC_SH"
          set +e
          python -B scripts/run_g040_overbank_sensitivity.py "$HEC_SH" \
            > hec_overbank_sensitivity_stdout.txt 2>&1
          RC=$?
          set -e
          cat hec_overbank_sensitivity_stdout.txt
          echo "$RC" > hec_overbank_sensitivity_exit_code.txt
          test -f assets/data/hec_hms_g040_full_basin/g040_mucum_overbank_sensitivity_latest.json
      - name: Build 2024 independent validation rainfall forcing
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_g040_historical_calibration_forcing.py \
            --events E27_MAY2024,E28_JUN2024 --max-workers 12 \
            > hec_2024_forcing_stdout.txt 2>&1
          cat hec_2024_forcing_stdout.txt
      - name: Apply frozen 2023 models to 2024 without recalibration
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          test -n "$HEC_SH"
          set +e
          python -B scripts/validate_g040_frozen_2024_transfer.py "$HEC_SH" \
            > hec_2024_transfer_stdout.txt 2>&1
          RC=$?
          set -e
          cat hec_2024_transfer_stdout.txt
          echo "$RC" > hec_2024_transfer_exit_code.txt
          test -f assets/data/hec_hms_g040_full_basin/g040_frozen_2024_transfer_validation_latest.json
      - name: Diagnose frozen 2024 peak timing and evidence quality
        if: always()
        continue-on-error: true
        run: |
          python -B scripts/diagnose_g040_frozen_2024_timing.py
      - name: Export full observed vs simulated hydrographs
        if: always()
        continue-on-error: true
        run: |
          python -B scripts/export_g040_research_hydrographs.py
      - name: Preserve research evidence without publishing to main
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g040-research-balanced-hydrographs
          if-no-files-found: warn
          path: |
            hec_research_stdout.txt
            hec_research_exit_code.txt
            assets/data/hec_hms_g040_full_basin/g040_e1_multievent_calibration_latest.json
            assets/data/hec_hms_g040_full_basin/g040_e1_multievent_calibration_candidates.csv
            assets/data/hec_hms_g040_full_basin/historical_calibration_forcing/manifest_latest.json
            hec_routing_sensitivity_stdout.txt
            hec_routing_sensitivity_exit_code.txt
            assets/data/hec_hms_g040_full_basin/g040_e1_mucum_routing_sensitivity_latest.json
            assets/data/hec_hms_g040_full_basin/g040_e1_mucum_routing_sensitivity_candidates.csv
            hec_overbank_sensitivity_stdout.txt
            hec_overbank_sensitivity_exit_code.txt
            assets/data/hec_hms_g040_full_basin/g040_mucum_overbank_sensitivity_latest.json
            assets/data/hec_hms_g040_full_basin/g040_mucum_overbank_sensitivity_candidates.csv
            assets/data/hec_hms_g040_full_basin/g040_research_hydrograph_exports/*.csv
            assets/data/hec_hms_g040_full_basin/g040_research_hydrograph_exports/manifest.json
            hec_2024_forcing_stdout.txt
            hec_2024_transfer_stdout.txt
            hec_2024_transfer_exit_code.txt
            assets/data/hec_hms_g040_full_basin/g040_frozen_2024_transfer_validation_latest.json
            assets/data/hec_hms_g040_full_basin/g040_frozen_2024_transfer_validation_scores.csv
            assets/data/hec_hms_g040_full_basin/g040_frozen_2024_timing_quality_diagnostic.csv
            assets/data/hec_hms_g040_full_basin/g040_frozen_2024_validation_inputs/*.log
            assets/data/hec_hms_g040_full_basin/g040_frozen_2024_validation_inputs/hec_runs/*/project/hec_output_values.csv
            assets/data/hec_hms_g040_full_basin/historical_calibration_forcing/E27_MAY2024/scenario.json
            assets/data/hec_hms_g040_full_basin/historical_calibration_forcing/E28_JUN2024/scenario.json
