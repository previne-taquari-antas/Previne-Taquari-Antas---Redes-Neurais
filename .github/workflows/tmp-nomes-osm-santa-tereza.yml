name: Temporario - nomes OSM de Santa Tereza

# Temporario (sai antes do merge): baixa os nomes de ruas e lugares do OSM
# para nomear os locais altos sugeridos e comita o JSON no proprio branch.
on:
  push:
    branches:
      - claude/locais-altos-santa-tereza
    paths:
      - ".github/workflows/tmp-nomes-osm-santa-tereza.yml"
      - "codigo_python/09_rota_fuga/baixar_nomes_osm.py"

permissions:
  contents: write

jobs:
  nomes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            codigo_python/09_rota_fuga/
            assets/data/rota_fuga/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Baixar nomes do OSM
        run: python codigo_python/09_rota_fuga/baixar_nomes_osm.py santa_tereza
      - name: Comitar no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/rota_fuga/osm_nomes_santa_tereza.json
          git commit -m "dados: nomes OSM de Santa Tereza para os locais altos [skip ci]" || exit 0
          git push
