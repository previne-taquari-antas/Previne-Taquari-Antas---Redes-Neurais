name: Deploy static research site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "assets/previsao_fila.js"
      - "scripts/validate_site_frontend.py"
      - "scripts/optimize_static_site.py"
      - "scripts/test_static_site_optimization.py"
      - "scripts/test_site_accessibility.py"
      - "scripts/test_site_recovery.js"
      - "scripts/test_gt_page.js"
      - "scripts/test_live_feed.js"
      - "scripts/test_ai_lab.js"
      - "scripts/test_research_patterns.js"
      - "scripts/test_range_controls.js"
      - "scripts/test_public_forecast.js"
      - "index.html"
      - "projeto.html"
      - "pesquisas.html"
      - "dashboard_bacia.html"
      - "ai_lab_brasil.html"
      - "vulnerabilidade.html"
      - "santa_tereza_inundacao.html"
      - "santa_tereza_previsao_inundacao.html"
      - "santa_tereza_previsao_inundacao_usuario.html"
      - "santa_tereza_painel_evacuacao.html"
      - "santa_tereza_painel_casas.html"
      - "mucum_painel_casas.html"
      - "santa_tereza_rota_fuga*.html"
      - "mucum_previsao_inundacao.html"
      - "mucum_previsao_inundacao_usuario.html"
      - "plataforma_hec_twin.html"
      - "plataforma_bacia.html"
      - "pesquisa_status*.html"
      - "pesquisas/**"
      - "inventario/**"
      - "assets/css/**"
      - "assets/js/**"
      - "assets/logos/**"
      - "assets/previsao_panorama.js"
      - "assets/previsao_panorama.css"
      - "assets/data/research_*.json"
      - "assets/data/acervo_pesquisas.json"
      - "assets/data/ai_lab/**"
      - "assets/data/basin_forecast_points.json"
      # O mapa lê Raw primeiro e Pages como contingência. Manter esta cópia
      # sincronizada reduz a dependência do cache do Raw e preserva o feed
      # quando o endpoint externo oscila.
      - "assets/data/basin_station_forecast_latest.json"
      - "assets/data/agenda_pesquisas.json"
      - "scripts/validate_osm_tiles.py"
      - "codigo_python/02_mdt_hand_mancha/dividir_contornos_por_nivel.py"
      - "scripts/test_contornos_por_nivel.py"
      - "scripts/apply_institutional_logos.py"
      - "scripts/validar_panorama_site.py"
      - "scripts/validate_santa_tereza_lidar_contract.py"
      - "codigo_python/02_mdt_hand_mancha/refinar_mdt_santa_tereza.py"
      - "scripts/build_unified_event_spatial_dashboard.py"
      - "scripts/test_unified_event_spatial_dashboard.py"
      - "assets/data/estudo_caso_resposta_v002.json"
      - "assets/data/estudo_caso_territorio/**"
      - "assets/data/rota_fuga_santa_tereza*.json"
      # Dados das páginas de rotas (ex.: santa_tereza_rotas_altas_set2023.json); antes
      # só o publish-pages.yml, agora manual, publicava JSON fora destas pastas.
      - "assets/data/rota_fuga/**"
      # HAND/MDT LiDAR de Santa Tereza: qualquer derivado publicado deve
      # disparar Pages imediatamente, sem depender do cron de 2 h.
      - "assets/data/santa_tereza_inundacao/**"
      # Plataforma HEC/REC da bacia G040: mapa + feed precisam republicar o Pages.
      - "assets/data/estudo_bacia_taquari_antas/**"
      # Estudos HEC-HMS integrados têm páginas próprias e dados auditáveis.
      - "assets/data/hec_hms_integrated_taquari_antas/**"
      # Replays históricos têm páginas e dados próprios; qualquer revisão
      # precisa atualizar o Pages, mesmo sem alterar a sala integrada.
      - "assets/data/mucum_eventwise_replay_calibrated/**"
      - "assets/data/santa_tereza_eventwise_replay_rna_2h/**"
      - "assets/data/servicos/**"
      - "assets/data/vulnerabilidade/**"
      - "assets/data/porto_alegre/**"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    # Republica o HTML/assets a cada 2 h. O JSON do robô não vai no
    # artefato; o ao vivo lê GitHub Raw/CDN. Não republicar a cada 5 min.
    - cron: "41 */2 * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Atualiza feed meteorológico de Santa Tereza"
      - "Atualiza feed meteorológico de Muçum"
      - "Contexto automático da pesquisa da bacia"
      - "HEC twin Muçum forward ~5d"
      # A QA publica os JSONs de pesquisa com GITHUB_TOKEN. Esse commit não
      # dispara outro workflow de push; ouvir a conclusão da QA mantém o
      # Pages sincronizado com o estado que acabou de ser validado.
      - "QA automatizada da pesquisa"
      - "Sincroniza contrato espacial LiDAR da pesquisa"
      - "PREVINE AI Lab - treinamento automatico"
      - "G040 adaptive eventwise selector"
      - "G040 Stage-2 readiness"
      - "Serviços públicos — dados IEDE (bacia Taquari-Antas)"
      - "Vulnerabilidade — dados IBGE (bacia Taquari-Antas)"
      - "Publicar dados cartográficos Porto Alegre"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Todos os eventos publicam o MESMO site: um único deploy por vez.
  # A fila mantém a rodada pendente mais recente; o checkout lê main atual,
  # inclusive mudanças manuais anteriores, sem criar um backlog de builds.
  group: github-pages-site-recovery-20261024
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # O deploy pode ficar na fila enquanto os robôs publicam outro
          # ciclo. Ler a ponta atual de main no início do job evita que a
          # fila publique o snapshot anterior ao evento que o acordou.
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !*.mat
            # The corrected Muçum q83 catalog exposes these 20 training
            # artifacts as explicit downloads. Keep the remaining historical
            # MAT files out of the Pages artifact.
            assets/mat/2H_ALT__00[1-5]_MUC_H02_STZ_RECORTE_*.mat
            assets/mat/4H_ALT__00[6-9]_MUC_H04_STZ_RECORTE_*.mat
            assets/mat/4H_ALT__010_MUC_H04_STZ_RECORTE_*.mat
            assets/mat/8H_ALT__01[1-5]_MUC_H08_STZ_RECORTE_*.mat
            assets/mat/12H_ALT__01[6-9]_MUC_H12_STZ_RECORTE_*.mat
            assets/mat/12H_ALT__020_MUC_H12_STZ_RECORTE_*.mat
            !*.tif
            !*.py
            !*.md
            !*.yml
            !*.yaml
            scripts/validate_site_frontend.py
            scripts/optimize_static_site.py
            scripts/test_static_site_optimization.py
            scripts/test_site_accessibility.py
            scripts/test_contornos_por_nivel.py
            scripts/test_*.js
            scripts/validate_osm_tiles.py
            scripts/apply_institutional_logos.py
            scripts/validar_panorama_site.py
            scripts/validate_santa_tereza_lidar_contract.py
            codigo_python/02_mdt_hand_mancha/gerar_mosaico_mdt.py
            codigo_python/02_mdt_hand_mancha/gerar_mancha_mosaico.py
            codigo_python/02_mdt_hand_mancha/gerar_contornos_vetoriais.py
            codigo_python/02_mdt_hand_mancha/dividir_contornos_por_nivel.py
            codigo_python/02_mdt_hand_mancha/refinar_mdt_santa_tereza.py
            codigo_python/09_rota_fuga/gerar_rota_fuga_santa_tereza.py
            .github/workflows/deploy-pages.yml
            .github/workflows/refresh-spatial-30m.yml
            !Gemfile
            !Gemfile.lock
            assets/data/vulnerabilidade/referencias/README_AGREGADOS_TAQUARI.md
            assets/data/vulnerabilidade/referencias/README_OBITOS.md
            assets/data/vulnerabilidade/referencias/README.md
            assets/data/servicos/FONTES.md
            assets/data/vulnerabilidade/metadados/README_PRODUTO.md
            assets/data/vulnerabilidade/metadados/ESTILOS_QGIS_ARCGIS.md
            assets/data/vulnerabilidade/metadados/README_ESTILOS_QGIS.md
            assets/data/vulnerabilidade/metadados/ESPECIFICACAO_FICHA_TRIAGEM_CENARIOS.md
            assets/data/vulnerabilidade/brutos/FONTES.md
          sparse-checkout-cone-mode: false

      - name: Validate frontend syntax, DOM and recovery contracts
        run: |
          python scripts/validate_site_frontend.py
          python scripts/test_static_site_optimization.py
          python scripts/test_site_accessibility.py
          python scripts/test_contornos_por_nivel.py
          node scripts/test_contornos_por_nivel.js
          node scripts/test_live_feed.js
          node scripts/test_ai_lab.js
          node scripts/test_research_patterns.js
          node scripts/test_range_controls.js
          node scripts/test_public_forecast.js
          node scripts/test_site_recovery.js
          node scripts/test_fmt_quando.js
          node scripts/test_basin_level_display.js
          node scripts/test_stz_shadow_ui.js
          node scripts/test_stz_v11_ui.js

      - name: Smoke test GT map for Santa Tereza and Mucum
        run: node scripts/test_gt_page.js

      - name: Validate OpenStreetMap tile contract
        run: python scripts/validate_osm_tiles.py

      - name: Validar panorama e leitores ao vivo
        run: python -B scripts/validar_panorama_site.py

      - name: Validar contrato LiDAR de Santa Tereza
        run: python -B scripts/validate_santa_tereza_lidar_contract.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static research site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Publica as páginas e os dados necessários para a pesquisa, mas não
          # os binários históricos de treinamento nem os rasters brutos (.tif).
          # Os 20 MAT q83 corrigidos permanecem disponíveis para download
          # auditável junto dos respectivos Excels.
          while IFS= read -r -d '' file; do
            case "$file" in
              # O ao vivo lê GitHub Raw/CDN/API. Copiar o JSON do robô para o
              # Pages fazia o HTML antigo parar no primeiro 200 e mostrar
              # 13–20 h de atraso com o rio já atualizado no main.
              previsao_ao_vivo.json|previsao_ao_vivo_mucum.json)
                continue
                ;;
              assets/data/vulnerabilidade/referencias/README_AGREGADOS_TAQUARI.md|assets/data/vulnerabilidade/referencias/README_OBITOS.md|assets/data/vulnerabilidade/referencias/README.md|assets/data/servicos/FONTES.md|assets/data/vulnerabilidade/metadados/README_PRODUTO.md|assets/data/vulnerabilidade/metadados/ESTILOS_QGIS_ARCGIS.md|assets/data/vulnerabilidade/metadados/README_ESTILOS_QGIS.md|assets/data/vulnerabilidade/metadados/ESPECIFICACAO_FICHA_TRIAGEM_CENARIOS.md|assets/data/vulnerabilidade/brutos/FONTES.md)
                mkdir -p "_site/$(dirname "$file")"
                cp -p -- "$file" "_site/$file"
                ;;
              assets/mat/2H_ALT__00[1-5]_MUC_H02_STZ_RECORTE_*.mat|assets/mat/4H_ALT__00[6-9]_MUC_H04_STZ_RECORTE_*.mat|assets/mat/4H_ALT__010_MUC_H04_STZ_RECORTE_*.mat|assets/mat/8H_ALT__01[1-5]_MUC_H08_STZ_RECORTE_*.mat|assets/mat/12H_ALT__01[6-9]_MUC_H12_STZ_RECORTE_*.mat|assets/mat/12H_ALT__020_MUC_H12_STZ_RECORTE_*.mat)
                mkdir -p "_site/$(dirname "$file")"
                cp -p -- "$file" "_site/$file"
                ;;
              .github/*|scripts/*|tests/*|docs/*|*.tif|*.py|*.md|*.yml|*.yaml|Gemfile|Gemfile.lock)
                continue
                ;;
              *.mat)
                continue
                ;;
              *)
                mkdir -p "_site/$(dirname "$file")"
                cp -p -- "$file" "_site/$file"
                ;;
            esac
          done < <(git ls-files -z)

          touch _site/.nojekyll

      - name: Dividir contornos de extravasamento por nível
        # As páginas de previsão baixam um índice leve e só os níveis desenhados
        # (assets/js/contornos_por_nivel.js); sem isto, voltam ao arquivo completo.
        run: python -B codigo_python/02_mdt_hand_mancha/dividir_contornos_por_nivel.py --site-dir _site

      - name: Aplicar logos PREVINE, UFRGS e LAGAM nas páginas públicas
        run: python -B scripts/apply_institutional_logos.py --site-dir _site

      - name: Optimize cacheable static assets
        run: python scripts/optimize_static_site.py --site-dir _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

