# RNAs v2 de Muçum e de Santa Tereza (4 h e 8 h com estações a montante) em SOMBRA.
# Não altera os feeds públicos: grava somente previsao_sombra_mucum.json, estado_chuva_subbacias_mucum.csv
# (chuva por sub-bacia dos últimos 35 dias, ANA + CEMADEN, para o balde de umidade do solo),
# previsao_sombra_santa_tereza.json e os históricos permanentes para avaliação.
name: Previsao em sombra - Mucum e Santa Tereza v2

on:
  push:
    branches: [main]
    paths:
      - 'codigo_python/01_previsao_ao_vivo/gerar_previsao_sombra_mucum.py'
      - 'codigo_python/01_previsao_ao_vivo/mucum_pistas_v4t.py'
      - 'assets/data/mucum_v4t/**'
      - 'assets/data/mucum_modelos_sombra.json'
      - 'assets/data/santa_tereza_modelos_sombra.json'
      - 'assets/mat/sombra_mucum_v2/**'
      - 'assets/mat/sombra_santa_tereza_v2/**'
      - 'scripts/test_previsao_sombra_mucum.py'
      - '.github/workflows/previsao-sombra-mucum.yml'
  schedule:
    # De hora em hora, longe dos minutos usados pelos robôs principais.
    - cron: '41 * * * *'
  workflow_dispatch:
  # O cron do GitHub é irregular; o robô ao vivo de Muçum (ciclo de ~5 min) serve de
  # relógio. O passo "Janela horária" deixa rodar no máximo uma vez por hora, a partir de :35 BRT,
  # quando as leituras de hora cheia da ANA já chegaram. Necessário para o +8 h/+12 h da página pública.
  workflow_run:
    workflows:
      - "Previsao ao vivo - Mucum"
    types:
      - completed

jobs:
  sombra:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: previsao-sombra-mucum
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Janela horária
        id: janela
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then echo "rodar=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as dt
          agora = dt.datetime.now(dt.timezone.utc) - dt.timedelta(hours=3)
          try:
              g = json.load(open("previsao_sombra_mucum.json"))["gerado_em"][:13]
          except Exception:
              g = ""
          print("rodar=" + ("1" if agora.minute >= 35 and g != agora.strftime("%Y-%m-%dT%H") else "0"))
          PY
      - uses: actions/setup-python@v7
        if: steps.janela.outputs.rodar == '1'
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        if: steps.janela.outputs.rodar == '1'
        run: pip install numpy==2.4.6 scipy==1.17.1 h5py==3.16.0
      - name: Testes e previsao em sombra
        if: steps.janela.outputs.rodar == '1'
        run: |
          git config user.name  "previne-robo"
          git config user.email "previne-robo@users.noreply.github.com"
          git pull --rebase --autostash origin main
          python -B -m unittest scripts.test_previsao_sombra_mucum
          # cada alvo é independente: falha em um não impede o outro
          mucum_rc=0
          # V4T consulta dezenas de postos ANA e CEMADEN; preserve os controles de qualidade.
          timeout --signal=TERM --kill-after=20s 1200s python -u -B codigo_python/01_previsao_ao_vivo/gerar_previsao_sombra_mucum.py || mucum_rc=$?
          if [ "$mucum_rc" -ne 0 ]; then echo "::error::Falha na sombra de Muçum (exit=$mucum_rc)"; fi
          timeout --signal=TERM --kill-after=20s 600s python -u -B codigo_python/01_previsao_ao_vivo/gerar_previsao_sombra_mucum.py --contrato assets/data/santa_tereza_modelos_sombra.json || echo "falha na sombra de Santa Tereza"
          for f in previsao_sombra_mucum.json historico_previsao_sombra_mucum.jsonl previsao_sombra_mucum_recente.json estado_chuva_subbacias_mucum.csv previsao_sombra_santa_tereza.json historico_previsao_sombra_santa_tereza.jsonl previsao_sombra_santa_tereza_recente.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "sem mudanca neste ciclo"
            exit "$mucum_rc"
          fi
          git commit -m "bot: previsao em sombra Mucum e Santa Tereza v2 [skip ci]"
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              exit "$mucum_rc"
            fi
            echo "push rejeitado (${tentativa}), rebase..."
            sleep 3
          done
          echo "falha ao publicar a sombra"
          exit 1
