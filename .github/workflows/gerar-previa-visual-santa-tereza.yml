name: Gerar previa visual leve - Santa Tereza

on:
  push:
    branches: [main]
    paths:
      - scripts/build_santa_tereza_water_preview.py
      - .github/workflows/gerar-previa-visual-santa-tereza.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: previa-visual-leve-stz
  cancel-in-progress: false

jobs:
  gerar-previa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout seletivo
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            scripts/build_santa_tereza_water_preview.py
            assets/data/santa_tereza_inundacao/contornos_mancha.json
            assets/data/santa_tereza_inundacao/contornos_previa_visual_leve.json
          sparse-checkout-cone-mode: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Simplificar contornos antigos apenas como visualizacao
        run: |
          pip install 'shapely>=2.0,<3.0'
          python scripts/build_santa_tereza_water_preview.py
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('assets/data/santa_tereza_inundacao/contornos_previa_visual_leve.json')
          d=json.loads(f.read_text())
          assert d['metadata']['preview_only'] is True
          assert d['metadata']['usable_for_building_risk'] is False
          assert d['metadata']['backwater_hydrodynamic_calibration'] is False
          assert len(d['features']) >= 5
          assert f.stat().st_size < 5500000
          print('Arquivo visual pronto:',f.stat().st_size,'bytes',len(d['features']),'quadros')
          PY
      - name: Publicar apenas a previa leve
        run: |
          git config user.name "previne-robo"
          git config user.email "previne-robo@users.noreply.github.com"
          git add assets/data/santa_tereza_inundacao/contornos_previa_visual_leve.json
          if git diff --cached --quiet; then
            echo "Previa identica; sem commit"
            exit 0
          fi
          git commit -m "bot: publica previa visual leve nao validada Santa Tereza [skip ci]"
          for n in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Previa leve publicada"
              exit 0
            fi
            sleep $((n*3))
          done
          exit 1
