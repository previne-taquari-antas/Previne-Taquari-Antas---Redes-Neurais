name: Base viária da SEMA (BCRS25) recortada

# Baixa a base viária da Base Cartográfica Vetorial Contínua do RS 1:25.000 (SEMA, publicada pela
# FEPAM), recorta para Santa Tereza e Muçum e grava no branch, para comparar com o OpenStreetMap
# (codigo_python/09_rota_fuga/comparar_vias.py). O site do estado não responde fora do Brasil.
on:
  workflow_dispatch:
  push:
    branches: [claude/base-viaria-sema]
    paths: [".github/workflows/vias-sema.yml"]

permissions:
  contents: write

jobs:
  vias:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependências
        run: python -m pip install numpy pillow shapely pyogrio pyproj
      - name: Baixar a base viária (FEPAM ou cópia no Internet Archive)
        run: python codigo_python/09_rota_fuga/vias_sema.py baixar /tmp/sema
      - name: Recortar para Santa Tereza e Muçum
        run: |
          set -euo pipefail
          find /tmp/sema -type f | sed 's/^/ARQ: /'
          mapfile -t SHPS < <(find /tmp/sema -iname '*.shp' | sort)
          python - "${SHPS[@]}" <<'PY'
          import sys, pyogrio
          for p in sys.argv[1:]:
              i = pyogrio.read_info(p)
              print(p, "| feições:", i["features"], "| CRS:", i["crs"], "| tipo:", i["geometry_type"], "| campos:", list(i["fields"]))
          PY
          python codigo_python/09_rota_fuga/vias_sema.py recortar "${SHPS[@]}"
      - name: Gravar no branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/rota_fuga/sema_bcrs25_vias_*.geojson
          if git diff --cached --quiet; then echo "nada mudou"; exit 0; fi
          git commit -m "dados: base viária da SEMA (BCRS25 1:25.000) recortada para Santa Tereza e Muçum" -m "$(cat /tmp/sema/origem.json)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vias-sema
          path: /tmp/sema/origem.json
          if-no-files-found: warn
