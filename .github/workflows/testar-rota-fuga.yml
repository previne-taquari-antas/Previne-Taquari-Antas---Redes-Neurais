name: Validar rotas de fuga ao vivo

on:
  push:
    paths:
      - "codigo_python/09_rota_fuga/**"
      - "santa_tereza_painel_casas.html"
      - "mucum_painel_casas.html"
      - "santa_tereza_painel_evacuacao.html"
      - "mucum_painel_evacuacao.html"
      - "pesquisas/santa-tereza-painel-evacuacao.html"
      - "pesquisas/mucum-painel-evacuacao.html"
      - "santa_tereza_rota_fuga_ruas_cenario.html"
      - "mucum_rota_fuga_ruas_cenario.html"
      - "pesquisas/santa-tereza-rota-fuga-ruas-cenario.html"
      - "pesquisas/mucum-rota-fuga-ruas-cenario.html"
      - "assets/previsao_fila.js"
      - "assets/data/servicos/abrigos.geojson"
      - "assets/data/eventos_analise.json"
      - "assets/data/mucum_eventos_analise.json"
      - "assets/data/mucum_contingencia_202607.json"
      - "tests/test_rota_fuga_painel.py"
      - "tests/test_rota_fuga_ao_vivo.py"
      - ".github/workflows/testar-rota-fuga.yml"
  pull_request:
    paths:
      - "codigo_python/09_rota_fuga/**"
      - "santa_tereza_painel_casas.html"
      - "mucum_painel_casas.html"
      - "santa_tereza_painel_evacuacao.html"
      - "mucum_painel_evacuacao.html"
      - "pesquisas/santa-tereza-painel-evacuacao.html"
      - "pesquisas/mucum-painel-evacuacao.html"
      - "santa_tereza_rota_fuga_ruas_cenario.html"
      - "mucum_rota_fuga_ruas_cenario.html"
      - "pesquisas/santa-tereza-rota-fuga-ruas-cenario.html"
      - "pesquisas/mucum-rota-fuga-ruas-cenario.html"
      - "assets/previsao_fila.js"
      - "assets/data/servicos/abrigos.geojson"
      - "assets/data/eventos_analise.json"
      - "assets/data/mucum_eventos_analise.json"
      - "assets/data/mucum_contingencia_202607.json"
      - "tests/test_rota_fuga_painel.py"
      - "tests/test_rota_fuga_ao_vivo.py"
      - ".github/workflows/testar-rota-fuga.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rota-fuga:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            codigo_python/09_rota_fuga/
            santa_tereza_painel_casas.html
            mucum_painel_casas.html
            santa_tereza_painel_evacuacao.html
            mucum_painel_evacuacao.html
            pesquisas/santa-tereza-painel-evacuacao.html
            pesquisas/mucum-painel-evacuacao.html
            santa_tereza_rota_fuga_ruas_cenario.html
            mucum_rota_fuga_ruas_cenario.html
            pesquisas/santa-tereza-rota-fuga-ruas-cenario.html
            pesquisas/mucum-rota-fuga-ruas-cenario.html
            assets/previsao_fila.js
            assets/data/servicos/abrigos.geojson
            tests/test_rota_fuga_ao_vivo.py
            tests/test_rota_fuga_painel.py
            assets/data/eventos_analise.json
            assets/data/mucum_eventos_analise.json
            assets/data/mucum_contingencia_202607.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias do teste
        run: python -m pip install numpy pillow
      - name: Compilar geradores sem rodar OSM/LiDAR
        run: python -m py_compile codigo_python/09_rota_fuga/*.py
      - name: Hora, nivel do rio e paginas das rotas
        run: python tests/test_rota_fuga_ao_vivo.py -v
      - name: Painel casa a casa, cheias registradas e abrigos
        run: python tests/test_rota_fuga_painel.py -v
