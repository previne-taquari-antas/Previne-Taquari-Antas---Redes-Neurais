name: GT risco a vida - diagnostico reprodutivel
on:
  pull_request:
    paths:
      - "scripts/gt_risco_vida.py"
      - "scripts/gt_cnefe_residencias.py"
      - "scripts/gt_auditar_residencias.py"
      - "scripts/gt_destinos.py"
      - "tests/test_gt_risco_vida.py"
      - "santa_tereza_painel_casas.html"
      - "mucum_painel_casas.html"
      - ".github/workflows/gt-risco-vida.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes unitarios das regras de isolamento
        run: python -m unittest discover -s tests -p test_gt_risco_vida.py -v
      - name: Recalcular cenarios dos dois municipios a partir dos paineis versionados
        run: python scripts/gt_risco_vida.py --cidade ambas --saida artifacts/gt_risco_vida
      - name: Baixar e filtrar CNEFE 2022 Santa Tereza
        run: python scripts/gt_cnefe_residencias.py --cidade santa_tereza --baixar --saida artifacts/gt_risco_vida
      - name: Baixar e filtrar CNEFE 2022 Mucum
        run: python scripts/gt_cnefe_residencias.py --cidade mucum --baixar --saida artifacts/gt_risco_vida
      - name: Auditar CNEFE x OSM Santa Tereza
        run: python scripts/gt_auditar_residencias.py --cidade santa_tereza --pasta artifacts/gt_risco_vida
      - name: Auditar CNEFE x OSM Mucum
        run: python scripts/gt_auditar_residencias.py --cidade mucum --pasta artifacts/gt_risco_vida
      - name: Conferir inventario de abrigos e capacidades
        run: python scripts/gt_destinos.py --saida artifacts/gt_risco_vida
      - name: Arquivar resultados de pesquisa - nao operacionais
        uses: actions/upload-artifact@v4
        with:
          name: gt-risco-vida-pilotos-nao-validados
          path: artifacts/gt_risco_vida/
          retention-days: 30
